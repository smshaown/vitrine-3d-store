<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitrine — Interactive 3D Virtual Boutique Store</title>
  <meta name="description" content="Walk-in 3D virtual boutique built with Three.js and GSAP. Explore garments on a brass rail, caps on a pegboard, floating bag & shoe walls, live color swapping, and glassmorphic product details.">

  <!-- OpenGraph & Twitter -->
  <meta property="og:title" content="Vitrine — Interactive 3D Virtual Boutique Store">
  <meta property="og:description" content="Look around a warmly lit 3D boutique room, inspect pieces up close, swap colors live in 3D, and add to bag.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Vitrine — Interactive 3D Virtual Boutique Store">
  <meta name="twitter:description" content="Walk-in 3D virtual boutique built with Three.js, CSS glassmorphism, and GSAP.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2326342d'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-style='italic' font-weight='900' font-size='18' text-anchor='middle' fill='%23efe5cf'%3EV%3C/text%3E%3C/svg%3E">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:ital,wght@1,800;1,900&display=swap">

  <!-- Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "Vitrine Virtual Store",
      "description": "Interactive 3D walk-in boutique store built with Three.js and GSAP."
    }
  </script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section
      id="vitrine-store"
      class="vs is-store"
      aria-label="Vitrine Virtual Store"
    >
      <!-- WebGL2 3D Canvas -->
      <canvas
        class="vs-canvas"
        role="img"
        aria-label="A virtual 3D boutique store you can look around"
        data-canvas
      ></canvas>

      <!-- Atmospheric Vignette & Film Grain -->
      <div class="vs-vignette" aria-hidden="true"></div>

      <!-- Loading State -->
      <p class="vs-loading" aria-live="polite" data-loading>Opening the store</p>

      <!-- Top Center Brand Masthead -->
      <header class="vs-mast">
        <b>Vitrine</b>
        <span>Virtual store</span>
      </header>

      <!-- Top-Right Bag Indicator (Fly-to-Cart Target) -->
      <button type="button" class="vs-bag-btn" aria-label="Shopping bag" data-bag-btn>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M6 7h12l1 13H5L6 7zM9 7V6a3 3 0 0 1 6 0v1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        </svg>
        <span class="vs-bag-count" data-bag-count>0</span>
      </button>

      <!-- Floating Hover Caption Pill -->
      <p class="vs-caption" aria-hidden="true" data-caption></p>

      <!-- Interaction Hint -->
      <p class="vs-hint" aria-hidden="true">Drag to look around · pick a section below</p>

      <!-- Bottom Floating Glass Section Menu -->
      <nav class="vs-menu" aria-label="Store sections" data-menu>
        <button type="button" data-go="store" aria-current="true">Store</button>
        <button type="button" data-go="clothing">Clothing</button>
        <button type="button" data-go="caps">Caps</button>
        <button type="button" data-go="bags">Bags</button>
        <button type="button" data-go="shoes">Shoes</button>
      </nav>

      <!-- Keyboard-Accessible Product List (Visually hidden until focused) -->
      <ul class="vs-list" aria-label="All products" data-list></ul>

      <!-- Graceful WebGL2 Fallback 2D Grid -->
      <div class="vs-flat" data-flat></div>

      <!-- Frosted Glass Product Panel (Desktop Drawer / Mobile Pull-Down Sheet) -->
      <aside class="vs-panel" aria-label="Product details" aria-hidden="true" inert data-panel>
        <div class="vs-grab" aria-hidden="true" data-grab></div>

        <div class="vs-top">
          <div class="vs-pager" data-pager>
            <button type="button" aria-label="Previous product" data-prev>
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
            <span data-pager-text>1 / 10</span>
            <button type="button" aria-label="Next product" data-next>
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <button type="button" class="vs-x" aria-label="Close product panel" data-close>
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <div class="vs-pi">
          <p class="vs-cat" data-p-cat></p>
          <h2 class="vs-name" tabindex="-1" data-p-name></h2>
          <p class="vs-price" data-p-price></p>
          <p class="vs-colour" data-p-kind></p>
          <a class="vs-more" href="#demo" data-p-more>Full details →</a>
        </div>

        <!-- Thumbnail Gallery -->
        <div class="vs-gal" data-gal></div>

        <!-- Dynamic Variant Options (Swatches + Sizes) -->
        <div data-opts></div>

        <!-- Optional Subscription Plan -->
        <label class="vs-plan" hidden data-plan-wrap>
          <span>Purchase option</span>
          <select data-plan-select></select>
        </label>

        <!-- Quantity + Add to Cart -->
        <div class="vs-buy">
          <div class="vs-qty">
            <span>Quantity</span>
            <div class="vs-step">
              <button type="button" aria-label="One less" data-qty-minus>−</button>
              <input type="number" min="1" max="99" value="1" aria-label="Quantity" data-qty-input>
              <button type="button" aria-label="One more" data-qty-plus>+</button>
            </div>
          </div>

          <button type="button" class="vs-add" data-add>Add to Cart</button>
        </div>

        <a class="vs-view" href="#demo" data-view-cart>View cart →</a>
      </aside>

      <!-- Full-Screen Photo Lightbox -->
      <div class="vs-zoom" role="dialog" aria-modal="true" aria-label="Product gallery zoom" hidden data-zoom>
        <img src="" alt="" data-zoom-img>
        <button type="button" class="vs-zb vs-zx" aria-label="Close zoom" data-zoom-close>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
        <button type="button" class="vs-zb vs-zp" aria-label="Previous image" data-zoom-prev>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button type="button" class="vs-zb vs-zn" aria-label="Next image" data-zoom-next>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <p class="vs-zc" data-zoom-count></p>
      </div>

      <!-- Status Toast -->
      <div class="vs-toast" role="status" aria-live="polite" data-toast></div>
    </section>
  </main>

  <footer class="demo-bar">
    <p>Vitrine 3D Virtual Boutique — HTML, CSS, Three.js &amp; GSAP. Drag to look around, pick a wall below, or click any piece to inspect.</p>
  </footer>

  <!-- GSAP 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
